on:
  workflow_dispatch:
  
jobs:
  test-download:
    runs-on: ubuntu-latest
    steps:
      - name: Show current IP address
        run: curl -s ifconfig.me || curl -s icanhazip.com

      - name: Test HEAD request (curl -I)
        run: curl -I https://repo.e-iceblue.com/repository/maven-public/e-iceblue/spire.xls/13.4.1/spire.xls-13.4.1.pom

      - name: Test GET request (curl -L)
        run: |
          for num in {1..10}
          do
            echo "Download $num"
            curl -L -o /tmp/test-$num.pom https://repo.e-iceblue.com/repository/maven-public/e-iceblue/spire.xls/13.4.1/spire.xls-13.4.1.pom
            echo "Complete $num"
          done
          ls -la /tmp/test.pom
